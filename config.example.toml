# arouter example configuration.
# Copy to ~/.config/arouter/config.toml and edit. Keys are resolved from
# real environment first, then ~/.config/arouter/.env, then ~/.config/aitop/.env.

[server]
# "0.0.0.0:3929" makes arouter reachable from the LAN. Transport is
# plain HTTP: trusted networks only — set auth.require + [[callers]]
# keys before exposing further.
bind = "127.0.0.1:3929"
# state_dir = "~/.local/state/arouter"   # usage.jsonl lives here

# ── callers: who is talking to arouter (multi-user metrics) ─────────────
# Each caller gets its own API key; point pi entries (or any OpenAI client)
# at arouter with that key to attribute usage per user/project.
#   - open mode (require=false, default): missing/unknown key → "anonymous";
#     X-Arouter-User / X-Arouter-Project request headers also work.
#   - require=true: unknown or missing key → 401; header identification is
#     ignored (spoofable without auth).
[[callers]]
name    = "alice"
project = "arouter"
key     = "env:AROUTER_KEY_ALICE"
# Personal daily on-demand cap (E4): stacks below pool/profile caps.
# budget_usd_day = 2.0

[[callers]]
name = "ci"
key  = "key:arouter-ci-local-token"

[auth]
require = false
# `require = true` without any [[callers]] is fine when api tokens (see
# the web UI's Tokens page / README "API tokens") carry the load — `ark_…`
# tokens authenticate on their own.

[grades]
ladder = ["A+", "A", "B", "C"]

# Client-facing routing groups — `/v1/models` lists one entry per group×grade
# (`arouter-subscription-A+`, `arouter-subscription-A`, …).
# `arouter-subscription` = every quota-pool model at its configured grade,
# falling back to local when the pool can't serve; clients send `group-grade`
# (e.g. "arouter-ondemand-A") to pin a grade, or the bare group id to let
# the routing strategy pick anywhere on the ladder.
# Member-form groups are equally valid: members = ["y/super", ...] with
# optional per-member grades = { "y/super" = "A+" } overrides and a
# group-local ladder. Define none and these three defaults apply.
[[groups]]
id = "arouter-subscription"
pool = "quota"
fallback = ["local"]

[[groups]]
id = "arouter-local"
pool = "local"

[[groups]]
id = "arouter-ondemand"
pool = "ondemand"
fallback = ["local"]

# Upstream deadlines (review F5): a connected but stalled upstream must
# never block failover. headers_secs bounds waiting for response headers;
# idle_secs bounds gaps between body reads (SSE chunk gaps included);
# max_attempts caps how many candidates one request may try.
[timeouts]
connect_secs = 5      # TCP/TLS connect
headers_secs = 60     # first response byte after request written
idle_secs = 120       # max gap between reads (documented "idle 120s")
max_attempts = 3      # documented top-3 per request

[routing]
# Upstream model discovery poll (`/v1/models`, ollama /api/tags): new
# models appear automatically, graded by catalog/heuristic. 0 = off;
# SIGHUP and config edits always trigger an immediate reload.
discovery_interval_secs = 300
# Warm-cache stickiness for the local pool: consecutive requests from one
# caller for one grade stick to the model that just served them, keeping
# the engine's prompt/KV cache hot. 0 disables.
sticky_local_secs = 600

[routing.fallback]
# Which grades may serve each requested grade. Omitted grades default to
# [self, one lower]. Requests can cap themselves with ranges: model "A+..A".
# allow = { "A+" = ["A+", "A"], "A" = ["A", "B"] }
cross_pool = []   # never silently fall into the on-demand pool

[quota]
# E3b: quota intake is native — the router asks its upstreams directly.
# Per provider, resolved in this order:
#   quota.sources."<prefix>"   explicit: headers | off | native:openrouter |
#                              native:zai (undocumented endpoint, opt-in) |
#                              manual | command:<cmd> (legacy escape hatch)
#   openrouter.ai upstreams    → native:openrouter (documented /auth/key)
#   everyone else              → headers: quota learned from x-ratelimit-*
#                                headers of responses arouter already
#                                proxies, plus 429 Retry-After (a 429 is
#                                ground truth: exhausted until it says
#                                otherwise).
poll_secs = 900
# z.ai uses an undocumented endpoint — explicit opt-in, never auto:
# sources = { "zai" = "native:zai" }
# Providers without any quota API: pin windows by hand (the web UI edits
# these later):
# [[quota.manual]]
# provider = "strata"
# label = "weekly"
# pct = 5.0
# resets_in_secs = 400000
# Legacy whole-snapshot command (aitop-shaped JSON) still works; explicit
# sources above always win. [quota_watcher] from older configs is read as
# an alias for this section.
# command = "aitop --json"
# Registry provider prefix → quota panel name; unmapped providers use
# exact then dot-stripped matching (zai → z.ai works out of the box).
provider_map = { "or" = "openrouter" }

[pool.ondemand]
preference = "cheapest"          # cheapest | fastest | manual
# Spend guards (routing.md §6; 0 = off). Daily/monthly are calendar-day
# UTC / rolling 30d; pace is a rolling hour. Stacks with per-profile and
# per-caller caps — the tightest wins.
# budget = { daily_usd = 5.0, monthly_usd = 50.0, pace_hourly_usd = 1.0, per_request_usd = 0.50 }

[profiles.vip]
description = "premium models for hard tasks"
# models = { exclude = ["ollama/*"] }

# ── models ────────────────────────────────────────────────────────────────
# id: provider/model (model part defaults to the upstream name)
# pool: quota | local | ondemand — hard boundary, never crossed silently
# auth: env:NAME | key:LITERAL | none
# wire: openai (default) | codex | gemini — codex routes through the native
#       Codex subscription adapter (E7): no API key and no base_url; the
#       login is read from the Codex CLI (`codex login`, ~/.codex/auth.json)
#       per request, and subscription usage limits are learned from the
#       x-codex-primary/secondary-* response headers.
#       gemini speaks Google's generateContent JSON API: base_url defaults
#       to https://generativelanguage.googleapis.com/v1beta and the key
#       rides x-goog-api-key; thinking tokens count into output spend.
# capabilities: capability-aware routing hints. `vision` = the model
#       accepts image inputs; `reasoning` = it accepts `reasoning_effort`.
#       A non-empty list is authoritative and REPLACES the curated table
#       (src/capabilities.toml) + name heuristic, so list the full set;
#       omit the key to auto-derive. A request with an image routes only
#       to vision models, a reasoning_effort only to reasoning models.
#
# Cross-pool fallback is explicit opt-in (routing.md §2). When the quota
# pool is exhausted, `cross_pool = ["ondemand"]` would pay instead of
# failing — every such response carries X-Arouter-Cross-Pool and still
# passes the on-demand budget guards:
# [routing.fallback]
# cross_pool = ["ondemand"]

[[models]]
id        = "zai/glm-5.3"
grade     = "A+"
pool      = ["quota"]
context   = 131072
base_url  = "https://api.z.ai/api/coding/paas/v4"
auth      = "env:ZAI_API_KEY"
weight    = 1.5

[[models]]
id        = "zai/glm-5.2"
grade     = "A"
pool      = ["quota"]
base_url  = "https://api.z.ai/api/coding/paas/v4"
auth      = "env:ZAI_API_KEY"

[[models]]
id        = "zai/glm-5.3-flash"
grade     = "B"
pool      = ["quota"]
base_url  = "https://api.z.ai/api/coding/paas/v4"
auth      = "env:ZAI_API_KEY"
weight    = 0.5

[[models]]
id        = "strata/qwen3.8-flash-next-coder-iq1_m"
grade     = "B"
pool      = ["local", "quota"]
context   = 131072
weight    = 2.0
base_url  = "http://127.0.0.1:8081/v1"
auth      = "none"

# E7: ChatGPT/Codex subscription as a quota-pool model — zero marginal
# cost, no API key; `codex login` owns the credentials.
[[models]]
id        = "codex/gpt-6-astra"
grade     = "A+"
pool      = ["quota"]
wire      = "codex"
# base_url is optional (defaults to https://chatgpt.com/backend-api)
# auth must be absent: the JWT comes from ~/.codex/auth.json

# Native Gemini wire: Google's JSON API, translated both ways through
# arouter's internal chat-completions currency (tools, images, thinking).
[[models]]
id        = "google/gemini-2.5-pro"
grade     = "A"
pool      = ["quota"]
wire      = "gemini"
auth      = "env:GEMINI_API_KEY"
# base_url is optional (defaults to the Google JSON API surface)

[[models]]
id        = "ollama/qwen2.5vl:7b"
grade     = "B"
pool      = ["local"]
# capabilities = ["vision"]  # optional: only when inference can't tell
base_url  = "http://127.0.0.1:11435/v1"
auth      = "none"

[[models]]
id        = "ollama/qwen3:14b"
grade     = "B"
pool      = ["local"]
weight    = 0.5
base_url  = "http://127.0.0.1:11434/v1"
auth      = "none"

# On-demand: pay-per-token — always priced so budgets & spend headers work.
[[models]]
id       = "or/anthropic/claude-opus-4.6"
grade    = "A+"
pool     = ["ondemand"]
base_url = "https://openrouter.ai/api/v1"
auth     = "env:OPENROUTER_API_KEY"
cost_in  = 5.0
cost_out = 25.0
profiles = ["vip"]          # exclusive to the vip profile

[[models]]
id       = "or/openai/gpt-5.2"
grade    = "A"
pool     = ["ondemand"]
base_url = "https://openrouter.ai/api/v1"
auth     = "env:OPENROUTER_API_KEY"
cost_in  = 1.25
cost_out = 10.0

# ─────────────────────────── local engine awareness (E8) ───────────────────────────
# Poll local inference engines so routing prefers models that are already
# resident (no cold load) and avoids engines that are mid-generation.
# Routing stays grade-first: residency only reorders within a grade.

[local_engines]
poll_secs = 30               # 0 = off (routing then ignores residency)

[[local_engines.engines]]
url  = "http://127.0.0.1:11434"   # engine root, no /v1
kind = "auto"                     # auto | ollama | llamacpp

# [[local_engines.engines]]
# url  = "http://127.0.0.1:8081"   # strata / llama.cpp server
# kind = "llamacpp"

# ─────────────────────────── web interface (E10a) ───────────────────────────
# Static shell + JSON API on the same listener. There is no default
# password: at startup the daemon prints
#     web: claim http://127.0.0.1:3929/claim/<token>
# The link is single-use and only consumable from loopback; opening it
# mints an admin session cookie (HttpOnly, SameSite=Strict). Mutating API
# calls additionally require a same-origin Origin/Host match.
# Disabling this removes /, /app.js, /style.css, /claim/* and /api/*;
# the proxy surface (/v1/...) is unaffected.

[web]
enabled = true
session_ttl_hours = 12
