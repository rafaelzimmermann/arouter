# Built-in model capability table (docs/routing.md §capabilities).
# Globs are matched against the model id and its last path segment,
# mirroring catalog.rs lookup. UNION across entries — a model can match
# both a vision entry and a reasoning entry. Explicit [[models]].capabilities
# always adds on top; the name heuristic in capabilities.rs covers the rest.
#
# capabilities: "vision" (accepts image inputs) and/or "reasoning"
# (accepts reasoning_effort). First-match is NOT exclusive here: every
# matching entry contributes its capabilities.

capabilities_version = 1

# ── multimodal families ──────────────────────────────────────────────
[[entry]]
match = [
  "*vl*", "*vision*", "*pixtral*", "*llava*", "*minicpm-v*", "*internvl*",
  "gpt-4o*", "gpt-4.1*", "gpt-5*",
  "claude*", "gemini*", "grok*",
  "glm-4v*", "glm-4.5*", "glm-4.6*", "glm-5*", "glm-6*",
  "llama-4*", "kimi-k2*",
]
capabilities = ["vision"]

# ── reasoning families (accept reasoning_effort) ─────────────────────
[[entry]]
match = [
  "*reasoning*", "*thinking*",
  "o1*", "o3*", "o4*",
  "gpt-5*",
  "gemini-3*",
  "claude-opus*", "*-opus-*",
  "deepseek-r1*", "deepseek-r2*", "deepseek-reasoner*",
  "qwen3-max*", "qwen3.8-max*",
  "grok-4*",
]
capabilities = ["reasoning"]
