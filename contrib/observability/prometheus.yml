# Prometheus scrape config for the LIVE daemon (contrib/observability).
# Prometheus runs in host networking, so this reaches arouter bound to
# 127.0.0.1:3929 directly.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: arouter
    static_configs:
      - targets: ["127.0.0.1:3929"]
