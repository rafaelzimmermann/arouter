<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif"><rect x="0" y="0" width="1280" height="820" rx="0" fill="#0D1117"/>
<polygon points="48,32 60,42 48,52 36,42" fill="#2DD4BF"/>
<text x="70" y="48" text-anchor="start" font-size="20" fill="#E6EDF3" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">arouter</text>
<rect x="176" y="33" width="84.8" height="22" rx="4" fill="#E3B341" opacity="0.14"/>
<text x="218.4" y="45" text-anchor="middle" font-size="10" fill="#E3B341" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">first access</text>
<text x="1232" y="48" text-anchor="end" font-size="11" fill="#E3B341" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">setup required · no admin on disk</text>
<rect x="48" y="88" width="1184" height="46" rx="8" fill="#161B22" stroke="#30363D"/>
<line x1="102" y1="111" x2="936" y2="111" stroke="#30363D" stroke-width="1"/>
<circle cx="82" cy="111" r="13" fill="#58A6FF"/>
<text x="82" y="115" text-anchor="middle" font-size="11" fill="#fff" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">1</text>
<text x="104" y="115" text-anchor="start" font-size="12" fill="#E6EDF3" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">Admin account</text>
<text x="270" y="115" text-anchor="start" font-size="13" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">→</text>
<circle cx="360" cy="111" r="13" fill="#0D1117" stroke="#6E7681" stroke-width="1.5"/>
<text x="360" y="115" text-anchor="middle" font-size="11" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">2</text>
<text x="382" y="115" text-anchor="start" font-size="12" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Connect provider</text>
<text x="548" y="115" text-anchor="start" font-size="13" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">→</text>
<circle cx="638" cy="111" r="13" fill="#0D1117" stroke="#6E7681" stroke-width="1.5"/>
<text x="638" y="115" text-anchor="middle" font-size="11" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">3</text>
<text x="660" y="115" text-anchor="start" font-size="12" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Choose models</text>
<text x="826" y="115" text-anchor="start" font-size="13" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">→</text>
<circle cx="916" cy="111" r="13" fill="#0D1117" stroke="#6E7681" stroke-width="1.5"/>
<text x="916" y="115" text-anchor="middle" font-size="11" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">4</text>
<text x="938" y="115" text-anchor="start" font-size="12" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">First API key</text>
<text x="48" y="194" text-anchor="start" font-size="34" fill="#E6EDF3" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">Set up arouter</text>
<text x="48" y="224" text-anchor="start" font-size="13" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Four small steps. The router keeps serving the moment</text>
<text x="48" y="244" text-anchor="start" font-size="13" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">the admin account exists — no restart, no config edit.</text>
<rect x="48" y="278" width="400" height="82" rx="8" fill="#58A6FF" opacity="0.08"/>
<rect x="48" y="278" width="3" height="82" rx="1.5" fill="#58A6FF"/>
<circle cx="70" cy="300" r="12" fill="#58A6FF"/>
<text x="70" y="304" text-anchor="middle" font-size="10" fill="#fff" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">1</text>
<text x="92" y="304" text-anchor="start" font-size="13" fill="#E6EDF3" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">Admin account</text>
<text x="92" y="324" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">You are here. This account owns tokens, models and overrides.</text>
<circle cx="70" cy="394" r="12" fill="#0D1117" stroke="#8B949E" stroke-width="1.3"/>
<text x="70" y="398" text-anchor="middle" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">2</text>
<text x="92" y="398" text-anchor="start" font-size="13" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Connect provider</text>
<text x="92" y="418" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Native quota/balance for DeepSeek, z.ai and OpenRouter, or a manual window.</text>
<circle cx="70" cy="488" r="12" fill="#0D1117" stroke="#8B949E" stroke-width="1.3"/>
<text x="70" y="492" text-anchor="middle" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">3</text>
<text x="92" y="492" text-anchor="start" font-size="13" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Choose models</text>
<text x="92" y="512" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Discovery proposes models; you choose grades, pools and weights.</text>
<circle cx="70" cy="582" r="12" fill="#0D1117" stroke="#8B949E" stroke-width="1.3"/>
<text x="70" y="586" text-anchor="middle" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">4</text>
<text x="92" y="586" text-anchor="start" font-size="13" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">First API key</text>
<text x="92" y="606" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Scoped key with a daily budget. The plaintext is shown once.</text>
<rect x="48" y="690" width="400" height="78" rx="8" fill="#161B22" stroke="#30363D"/>
<text x="64" y="716" text-anchor="start" font-size="9" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" letter-spacing="0.1em">WHY THIS ORDER</text>
<text x="64" y="738" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">A key is useless without a model; a model is untrusted without</text>
<text x="64" y="754" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">a provider. Setup ends with a real test request.</text>
<rect x="480" y="160" width="752" height="608" rx="12" fill="#161B22" stroke="#30363D"/>
<text x="512" y="204" text-anchor="start" font-size="21" fill="#E6EDF3" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">Create the admin account</text>
<text x="512" y="228" text-anchor="start" font-size="11" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">This closes public setup permanently.</text>
<rect x="1066" y="187" width="78.89999999999999" height="22" rx="4" fill="#58A6FF" opacity="0.14"/>
<text x="1105.45" y="199" text-anchor="middle" font-size="10" fill="#58A6FF" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">step 1 of 4</text>
<text x="512" y="264" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">USERNAME</text>
<rect x="512" y="272" width="300" height="34" rx="6" fill="#0D1117" stroke="#30363D"/>
<text x="524" y="294" text-anchor="start" font-size="12" fill="#E6EDF3" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">alice</text>
<text x="840" y="264" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">DISPLAY NAME (OPTIONAL)</text>
<rect x="840" y="272" width="328" height="34" rx="6" fill="#0D1117" stroke="#30363D"/>
<text x="852" y="294" text-anchor="start" font-size="12" fill="#E6EDF3" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Alice</text>
<text x="512" y="350" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">PASSWORD</text>
<rect x="512" y="358" width="300" height="34" rx="6" fill="#0D1117" stroke="#30363D"/>
<text x="524" y="380" text-anchor="start" font-size="12" fill="#E6EDF3" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">••••••••••••••••</text>
<text x="512" y="404" text-anchor="start" font-size="9" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">12 characters minimum</text>
<text x="840" y="350" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">CONFIRM PASSWORD</text>
<rect x="840" y="358" width="328" height="34" rx="6" fill="#0D1117" stroke="#30363D"/>
<text x="852" y="380" text-anchor="start" font-size="12" fill="#E6EDF3" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">••••••••••••••••</text>
<text x="840" y="404" text-anchor="start" font-size="9" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">must match</text>
<text x="512" y="440" text-anchor="start" font-size="9" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" letter-spacing="0.1em">STRENGTH</text>
<rect x="574" y="433" width="180" height="6" rx="3.0" fill="#30363D"/>
<rect x="574" y="433" width="140.4" height="6" rx="3.0" fill="#3FB950"/>
<text x="766" y="440" text-anchor="start" font-size="10" fill="#3FB950" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">strong</text>
<text x="840" y="440" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">No plaintext is stored — Argon2id only.</text>
<rect x="512" y="466" width="688" height="72" rx="8" fill="#E3B341" opacity="0.1"/>
<rect x="512" y="466" width="3" height="72" rx="1.5" fill="#E3B341"/>
<text x="528" y="490" text-anchor="start" font-size="12" fill="#E3B341" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">Finish this before exposing the port</text>
<text x="528" y="510" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">While no admin exists, the first visitor can claim the console. Bind to localhost, complete setup, then publish.</text>
<text x="528" y="526" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">The console will show this warning until an admin exists.</text>
<rect x="512" y="566" width="196" height="42" rx="6" fill="#1F6FEB"/>
<text x="610.0" y="591.0" text-anchor="middle" font-size="13" fill="#FFFFFF" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" font-weight="bold">Create admin &amp; continue</text>
<rect x="720" y="566" width="120" height="42" rx="6" fill="#1B222C" stroke="#30363D"/>
<text x="780.0" y="591.0" text-anchor="middle" font-size="11" fill="#E6EDF3" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Read security notes</text>
<text x="512" y="632" text-anchor="start" font-size="11" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">After this: connect a provider → choose models → create a key.</text>
<line x1="512" y1="660" x2="1200" y2="660" stroke="#30363D" stroke-width="1"/>
<text x="512" y="686" text-anchor="start" font-size="9" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif" letter-spacing="0.1em">WHAT GETS WRITTEN</text>
<circle cx="518" cy="704" r="3" fill="#3FB950"/>
<text x="530" y="708" text-anchor="start" font-size="10" fill="#E6EDF3" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">state_dir/admin.toml</text>
<text x="700" y="708" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">Argon2id hash · mode 0600 · atomic write</text>
<circle cx="518" cy="728" r="3" fill="#3FB950"/>
<text x="530" y="732" text-anchor="start" font-size="10" fill="#E6EDF3" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">state_dir/web.toml</text>
<text x="700" y="732" text-anchor="start" font-size="10" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">only when you change models or quota</text>
<text x="1232" y="792" text-anchor="end" font-size="10" fill="#6E7681" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">No claim link. No startup token. Setup is a browser flow.</text>
</svg>
