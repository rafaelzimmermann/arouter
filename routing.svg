<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9D1D9"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3FB950"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58A6FF"/>
    </marker>
  </defs>

  <rect width="960" height="400" rx="16" fill="#0D1117"/>

  <!-- request cards -->
  <g>
    <rect x="30" y="52" width="300" height="96" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="180" y="82" text-anchor="middle" font-size="13" fill="#8B949E">POST /v1/chat/completions</text>
    <text x="180" y="120" text-anchor="middle" font-size="22" fill="#E6EDF3">{"model": "A+"}</text>

    <rect x="30" y="252" width="300" height="96" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="180" y="282" text-anchor="middle" font-size="13" fill="#8B949E">POST /v1/chat/completions</text>
    <text x="180" y="320" text-anchor="middle" font-size="22" fill="#E6EDF3">{"model": "B"}</text>
  </g>

  <!-- input beams -->
  <line x1="336" y1="100" x2="436" y2="153" stroke="#C9D1D9" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-gray)"/>
  <line x1="336" y1="300" x2="436" y2="247" stroke="#C9D1D9" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-gray)"/>

  <!-- router node -->
  <circle cx="480" cy="200" r="110" fill="url(#glow)"/>
  <polygon points="480,136 544,200 480,264 416,200" fill="url(#node)"/>
  <text x="480" y="292" text-anchor="middle" font-size="17" font-weight="bold" fill="#C9D1D9">arouter</text>
  <text x="480" y="316" text-anchor="middle" font-size="12" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">quota · pace · reset · budget · health</text>

  <!-- output beams -->
  <line x1="524" y1="153" x2="620" y2="100" stroke="#3FB950" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-green)"/>
  <line x1="524" y1="247" x2="620" y2="300" stroke="#58A6FF" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-blue)"/>

  <!-- result chips -->
  <g>
    <rect x="630" y="52" width="300" height="96" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="780" y="98" text-anchor="middle" font-size="24" font-weight="bold" fill="#3FB950">glm-5.3</text>
    <text x="780" y="126" text-anchor="middle" font-size="13" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">z.ai coding plan · subscription quota</text>

    <rect x="630" y="252" width="300" height="96" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="780" y="298" text-anchor="middle" font-size="24" font-weight="bold" fill="#58A6FF">qwen3.8-flash</text>
    <text x="780" y="326" text-anchor="middle" font-size="13" fill="#8B949E" font-family="-apple-system,'Segoe UI','Noto Sans',sans-serif">local llama.cpp engine · always $0</text>
  </g>
</svg>
