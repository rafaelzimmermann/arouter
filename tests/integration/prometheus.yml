# Prometheus scrape config for the E9 rig: the arouter container, 2s
# interval so the matrix's runtime-flippable fixtures land fast.
global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: arouter
    # arouter requires caller auth on /metrics when auth.require=true
    # (F12) — scraping presents a caller key like any other client.
    authorization:
      credentials: it-alice-key
    static_configs:
      - targets: ["arouter:3929"]
